<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#1B120E" />
  <title>Goli Pavan Sai Krishna — AI/ML &amp; Full-Stack Engineer</title>
  <meta name="description" content="AI/ML and full-stack engineer who ships systems end to end: agentic RAG, predictive autoscaling on Kubernetes, applied ML for support triage, customer analytics and a hybrid recommender — each with numbers you can check." />
  <meta name="author" content="Goli Pavan Sai Krishna" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Goli Pavan Sai Krishna — AI/ML &amp; Full-Stack Engineer" />
  <meta property="og:description" content="Building AI and ML systems end to end — agentic RAG, forecasting, applied ML, and the full-stack services that ship them." />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.38' cy='.34' r='.7'%3E%3Cstop offset='0' stop-color='%23FFF3D6'/%3E%3Cstop offset='.45' stop-color='%23FF9A3C'/%3E%3Cstop offset='1' stop-color='%23B8321A'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%231B120E'/%3E%3Ccircle cx='15' cy='16' r='8.5' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="grain" aria-hidden="true"></div>
  <div id="cursor" class="cursor" aria-hidden="true">
    <span class="cursor-ring"><span class="cursor-ring-body"><span class="cursor-label">View</span></span></span>
    <span class="cursor-dot"></span>
  </div>

  <header id="nav" class="nav">
    <nav class="nav-inner" aria-label="Primary">
      <a href="#top" id="nav-mark" class="nav-mark">Goli Pavan Sai Krishna</a>
      <ul id="nav-links" class="nav-links" role="list"></ul>
      <a id="nav-cta" class="btn btn-ghost btn-small nav-cta" href="#contact">Get in touch</a>
      <button id="nav-toggle" type="button" class="nav-toggle"
              aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span class="toggle-lines" aria-hidden="true"><span></span><span></span></span>
      </button>
    </nav>
  </header>

  <div id="menu" class="menu" hidden>
    <ul id="menu-links" class="menu-links" role="list"></ul>
    <a id="menu-email" class="menu-email link-draw" href="#contact"></a>
  </div>

  <main id="main">

    <!-- The hot shop: name cools into shape beside a turning gather -->
    <section id="top" class="hero" aria-labelledby="hero-name">
      <div class="hero-light" aria-hidden="true"></div>
      <canvas id="network" class="hero-network" aria-hidden="true"></canvas>

      <div class="hero-inner">
        <h1 id="hero-name" class="hero-name"></h1>
        <p id="hero-tagline" class="hero-tagline"></p>
        <div id="hero-ctas" class="hero-ctas"></div>
      </div>

      <nav class="hero-pieces-wrap" aria-label="Projects">
        <ul id="hero-pieces" class="hero-pieces" role="list"></ul>
      </nav>
    </section>

    <section id="about" class="section about" aria-labelledby="about-heading">
      <div class="wrap about-grid">
        <div class="about-side">
          <h2 id="about-heading" class="section-title" data-reveal="title"></h2>
          <div class="edu glow-card" data-reveal>
            <div id="edu-rows" class="edu-rows"></div>
          </div>
        </div>
        <div class="about-card glow-card">
          <p id="about-bio" class="about-bio" data-reveal></p>
        </div>
      </div>
    </section>

    <section id="work" class="section work" aria-labelledby="work-heading">
      <div class="wrap">
        <div class="section-head">
          <h2 id="work-heading" class="section-title" data-reveal="title"></h2>
          <p id="work-note" class="section-note" data-reveal></p>
        </div>
        <div id="projects" class="pieces"></div>
      </div>
    </section>

    <section id="stack" class="section field field-cobalt" aria-labelledby="stack-heading">
      <div class="wrap">
        <h2 id="stack-heading" class="section-title" data-reveal="title"></h2>
        <div id="stack-groups" class="stack-list"></div>
      </div>
    </section>

    <section id="contact" class="section field field-amber" aria-labelledby="contact-heading">
      <div class="wrap">
        <h2 id="contact-heading" class="section-title contact-title" data-reveal="title"></h2>
        <div class="contact-grid">
          <div id="contact-cta" class="contact-cta" data-reveal></div>
          <ul id="contact-links" class="contact-links" role="list"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p id="footer-copy"></p>
      <p id="footer-note"></p>
    </div>
  </footer>

  <div id="load-error" class="load-error" hidden>
    <div class="load-error-box">
      <h2>Content could not load</h2>
      <p>This site reads its text from <code>content.json</code>, which browsers block over <code>file://</code>. Start a local server in this folder and open the address it prints:</p>
      <pre><code>python3 -m http.server 8000</code></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
